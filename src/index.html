<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="header-wrap">
        <a
          href="#"
          class="header-logo"
        >
          <img
            src="images/logo.png"
            alt="MOYO_logo"
          />
        </a>
        <nav class="header-nav">
          <ul class="nav-list">
            <li class="list-item">
              <a
                href="#"
                class="link-item is-active"
              >
                apple
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
              >
                samsung
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
              >
                smartphones
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
                data-qa="hover"
              >
                laptops & computers
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
              >
                gadgets
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
              >
                tablets
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
              >
                photo
              </a>
            </li>
            <li class="list-item">
              <a
                href="#"
                class="link-item"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
